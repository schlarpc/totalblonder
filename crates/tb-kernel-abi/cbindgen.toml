# cbindgen configuration for kernels/tb_kernel_abi.h (see nix/kernels.nix: `abiHeader`).
# The header is C++ (the kernels are CUDA C++), constants are macros so that they keep the
# `int` semantics the kernels were written against.
language = "C++"
pragma_once = true
include_version = false
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
usize_is_size_t = true
autogen_warning = "// Generated by cbindgen from crates/tb-kernel-abi/src/lib.rs. Do not edit: change the Rust and regenerate (nix run .#abi-header)."
documentation = true
documentation_style = "c++"
line_length = 120

[const]
allow_static_const = false
allow_constexpr = false

[export]
item_types = ["constants", "structs"]
# cbindgen exports only what a function signature reaches; this crate has no functions.
include = ["VlcCode", "Tables", "Geo", "SessPar", "MbInfo", "MbRes", "RowStat", "PicStat", "Bufs",
  "Taps", "ConvClass", "ConvJob", "RectJob", "CscPar", "PreJob"]

[struct]
derive_eq = false
