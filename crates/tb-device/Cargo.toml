[package]
name = "tb-device"
description = "The device protocol: buffer handles, typed kernel launches, per-phase plans, completion records, and a recording/replaying device for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tb-kernel-abi.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
# Only for the feature `golden`: traces and normal forms from the golden records, for
# the tests of other crates (the tick's).
tb-golden = { workspace = true, optional = true }

[features]
golden = ["dep:tb-golden"]

[dev-dependencies]
tb-golden.workspace = true

[lints]
workspace = true
