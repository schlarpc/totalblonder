      function logout()
      {
        var temp;

        return 0;
      }
      function golink(field)
      {
        var temp;
        temp = field + "?session_id=" + document.configForm.session_id.value;
        document.location = temp;
        return 0;
      }

      function gobox(field1, field2)
      {
        var temp;
        temp = field1 + "?session_id=" + document.configForm.session_id.value + "&boxNumber=" + field2;
        document.location = temp;
        return 0;
      }

      function goslot(field1, field2)
      {
        var temp;
        temp = field1 + "?session_id=" + document.configForm.session_id.value + "&slotNumber=" + field2;
        document.location = temp;
        return 0;
      }

      function getCookie(c_name)
      {
        if(document.cookie.length > 0)
        {
          c_start = document.cookie.indexOf(c_name + "=");
          if(c_start != -1)
          {
            c_start = c_start + c_name.length + 1;
            c_end = document.cookie.indexOf(";", c_start);
            if(c_end == -1) c_end = document.cookie.length;
            document.configForm.session_id.value = document.cookie.substring(c_start, c_end);
          }
        }
        return "";
      }

    //  End -->
