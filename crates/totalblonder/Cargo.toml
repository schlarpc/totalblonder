tb-timeline.workspace = true
serde_json.workspace = true
tb-device.workspace = true
tb-device-ref.workspace = true
tb-device-gpu.workspace = true
tb-engine.workspace = true
tb-m2v-encoder.workspace = true
tb-m2v-syntax.workspace = true
thiserror.workspace = true
