[package]
name = "totalblonder"
description = "The server: configuration, carriers (mux and pacer), tables, programs (video, audio, fallback), inputs, control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tb-ts.workspace = true
tb-psip.workspace = true
tb-mux.workspace = true
tb-output.workspace = true
tb-media.workspace = true
tb-rtmp.workspace = true
tb-tsin.workspace = true
