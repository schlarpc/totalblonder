[package]
name = "tb-avworker"
description = "The sandboxed decoder worker: the only program that links libav (libavcodec, libavutil, libswscale, libswresample); reads packets from a ring, writes frames into shared-memory slots, native or converted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tb-avworker"
path = "src/main.rs"

[dependencies]
# libavcodec, libavutil, and libswscale / libswresample for the optional converted outputs: no
# libavformat (no demuxers, no protocols, no file or network I/O), no device or filter
# libraries. The raw bindings, wrapped in src/av.rs.
ffmpeg-sys-the-third = { version = "6.0.0", default-features = false, features = [
    "avcodec",
    "swscale",
    "swresample",
] }
libc.workspace = true
rustix.workspace = true
tb-decoder-proto.workspace = true
tb-media.workspace = true
tb-sandbox.workspace = true

[dev-dependencies]
tb-decoder-client.workspace = true
# the in-process decoder, for the overhead comparison of tests/bench.rs
tb-decode.workspace = true

[lints]
workspace = true
